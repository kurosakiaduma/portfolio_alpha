services:
  portfolio-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: portfolio-frontend:latest
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    environment:
      NODE_ENV: production
      PUBLIC_API_URL: ${PUBLIC_API_URL}
    depends_on:
      portfolio-backend:
        condition: service_healthy
    networks:
      - portfolio-network

  portfolio-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: portfolio-backend:latest
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      OLLAMA_BASE: ${OLLAMA_BASE:-http://ollama:11434}
      MODEL: ${MODEL:-mistral:7b-instruct}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PORT: '8000'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - portfolio-network

  ollama:
    image: ollama/ollama:latest
    container_name: portfolio-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge

volumes:
  ollama_data:
