  provisioningState: Succeeded
  runningStatus: Running
  template:
    containers:
      - name: portfolio-ollama
        image: ollama/ollama:latest
        command:
          - /bin/bash
          - -c
          - |
            /bin/ollama serve &
            OLLAMA_PID=$!
            echo "Waiting for Ollama to be ready..."
            
            until /bin/ollama list > /dev/null 2>&1; do
              sleep 2
            done
            
            echo "Ollama ready. Checking for model..."
            if ! /bin/ollama list | grep -q "mistral:7b-instruct"; then
              echo "Pulling mistral:7b-instruct..."
              /bin/ollama pull mistral:7b-instruct
            fi
            echo "Model ready. Serving."
            wait $OLLAMA_PID
        resources:
          cpu: 4.0
          memory: 8Gi
        volumeMounts:
          - volumeName: ollama-models
            mountPath: /root/.ollama
    initContainers: null
    revisionSuffix: ''
    scale:
      cooldownPeriod: 300
      maxReplicas: 1
      minReplicas: 1
      pollingInterval: 30
      rules: null
    serviceBinds: null
    terminationGracePeriodSeconds: null
    volumes:
      - name: ollama-models
        storageType: AzureFile
        storageName: ollama-storage
  workloadProfileName: Consumption
